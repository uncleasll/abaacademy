services:
  - type: web
    name: abaacademy-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: FRONTEND_URLS
        value: https://abaacademy.vercel.app
      - key: JWT_TTL_SECONDS
        value: "43200"
