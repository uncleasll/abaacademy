services:
  - type: web
    name: abaacademy
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_TTL_SECONDS
        value: "43200"
      - key: FRONTEND_URLS
        value: https://abaacademy.vercel.app
      - key: SEED_DEMO_DATA
        value: "false"
      - key: ACADEMY_TIMEZONE
        value: America/New_York
      - key: STAFF_ACCOUNTS_JSON
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ACADEMY_NAME
        value: Al-Bukhari Academy
